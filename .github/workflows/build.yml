# .github/workflows/build-and-deploy.yml
name: Build and Deploy Flutter App

on:
  pull_request:
    types: [closed]
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.38.5'
  JAVA_VERSION: '17'

jobs:
  build-and-deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true

    - name: Get Flutter dependencies
      run: flutter pub get

    - name: Run tests
      run: flutter test

    - name: Get version info
      id: version
      run: |
        VERSION=$(grep "version:" pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "build_number=$(echo $VERSION | cut -d '+' -f 2)" >> $GITHUB_OUTPUT
        echo "version_name=$(echo $VERSION | cut -d '+' -f 1)" >> $GITHUB_OUTPUT

    - name: Get PR description
      id: pr_info
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          echo "pr_body<<EOF" >> $GITHUB_OUTPUT
          echo "${{ github.event.pull_request.body }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "pr_title=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
        else
          echo "pr_body=Direct push to ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "pr_title=Build from ${{ github.ref_name }}" >> $GITHUB_OUTPUT
        fi

    - name: Build APK (split per ABI)
      run: |
        flutter build apk --split-per-abi --release

    - name: Create release info JSON
      id: release_json
      run: |
        cat > release_info.json << EOF
        {
          "version": "${{ steps.version.outputs.version }}",
          "version_name": "${{ steps.version.outputs.version_name }}",
          "build_number": "${{ steps.version.outputs.build_number }}",
          "title": "${{ steps.pr_info.outputs.pr_title }}",
          "release_notes": "🚀 New build available!\n\n${{ steps.pr_info.outputs.pr_body }}",
          "build_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "commit_sha": "${{ github.sha }}",
          "branch": "${{ github.ref_name }}",
          "workflow_run_id": "${{ github.run_id }}",
          "artifacts": {
            "apk_arm64": "app-arm64-v8a-release.apk",
            "apk_armeabi": "app-armeabi-v7a-release.apk",
            "apk_x86_64": "app-x86_64-release.apk"
          }
        }
        EOF
        
        echo "Release info created:"
        cat release_info.json

    - name: Upload to Firebase App Distribution (ARM64)
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: ${{ secrets.FIREBASE_APP_ID }}
        serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        groups: internal_testers,devs
        file: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        releaseNotes: |
          🚀 New build available! (ARM64)
          
          Version: ${{ steps.version.outputs.version }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          
          Changes:
          ${{ steps.pr_info.outputs.pr_body }}

    - name: Upload to Firebase App Distribution (ARMv7)
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: ${{ secrets.FIREBASE_APP_ID }}
        serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        groups: internal_testers,devs
        file: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
        releaseNotes: |
          🚀 New build available! (ARMv7)
          
          Version: ${{ steps.version.outputs.version }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          
          Changes:
          ${{ steps.pr_info.outputs.pr_body }}

    - name: Upload to Firebase App Distribution (x86_64)
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: ${{ secrets.FIREBASE_APP_ID }}
        serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        groups: internal_testers,devs
        file: build/app/outputs/flutter-apk/app-x86_64-release.apk
        releaseNotes: |
          🚀 New build available! (x86_64)
          
          Version: ${{ steps.version.outputs.version }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          
          Changes:
          ${{ steps.pr_info.outputs.pr_body }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Release v${{ steps.version.outputs.version }}
        body: |
          ## 🚀 Release v${{ steps.version.outputs.version }}
          
          **Build Information:**
          - Version: ${{ steps.version.outputs.version }}
          - Build Number: ${{ steps.version.outputs.build_number }}
          - Branch: ${{ github.ref_name }}
          - Commit: ${{ github.sha }}
          
          **Changes:**
          ${{ steps.pr_info.outputs.pr_body }}
          
          **APK Files:**
          - `app-arm64-v8a-release.apk` - For ARM64 devices (recommended)
          - `app-armeabi-v7a-release.apk` - For ARMv7 devices
          - `app-x86_64-release.apk` - For x86_64 devices (emulators)
          
          **Installation:**
          1. Download the APK for your device architecture
          2. Enable "Install from unknown sources" in your device settings
          3. Install the APK
          
          ---
          *This is a pre-release build for testing purposes.*
        files: |
          build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          build/app/outputs/flutter-apk/app-x86_64-release.apk
          release_info.json
        prerelease: true
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify success
      run: |
        echo "✅ Build and deployment completed successfully!"
        echo "📱 APKs uploaded to Firebase App Distribution for groups: internal_testers, devs"
        echo "🏷️ GitHub release created: v${{ steps.version.outputs.version }}"
        echo "📋 Release info JSON created and attached to release"